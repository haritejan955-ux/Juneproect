name: Deploy to AWS

# Runs after CI passes on main, or manually. Never builds/deploys from a PR or a branch other
# than main — see docs/deployment.md section 6 for why CI (correctness) and this workflow
# (release) are kept as two separate pipelines. See docs/aws-deployment.md section 7 for the
# full narrative and section 8 for the one-time bootstrap this workflow depends on (the ECS
# stack, ECR repos, and the GitHubActionsDeployRole must already exist).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC — no long-lived AWS credentials are stored in this repo
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    # Re-run the same gate ci.yml enforces on PRs, so a manual workflow_dispatch (which can
    # target any ref) can't skip straight to production without it. On a normal push-to-main
    # this is redundant with the PR's own CI run but cheap enough not to special-case away.
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      ECS_FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      ECS_BACKEND_TASK_FAMILY: ${{ vars.ECS_BACKEND_TASK_FAMILY }}
      ECS_FRONTEND_TASK_FAMILY: ${{ vars.ECS_FRONTEND_TASK_FAMILY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          IMAGE: ${{ env.ECR_BACKEND_REPOSITORY }}
        run: |
          docker build \
            -f docker/backend.Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Build and push frontend image
        env:
          IMAGE: ${{ env.ECR_FRONTEND_REPOSITORY }}
        run: |
          docker build \
            -f docker/frontend.Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_WS_BASE_URL="${{ vars.NEXT_PUBLIC_WS_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_API_KEY="${{ secrets.NEXT_PUBLIC_API_KEY }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Registers a new task definition revision from the currently-deployed one with only the
      # image field changed, rather than re-deriving the whole definition here — the source of
      # truth for cpu/memory/secrets/mount points stays infra/aws/ecs-stack.yaml, not this
      # workflow. A stack update (changing BackendImage/FrontendImage) achieves the same result
      # via CloudFormation and is the other supported way to roll out a new image — see
      # docs/aws-deployment.md section 8 step 3.
      - name: Deploy backend service
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$ECS_BACKEND_TASK_FAMILY" \
            --query 'taskDefinition')
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$ECR_BACKEND_REPOSITORY:${{ github.sha }}" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ')
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BACKEND_SERVICE" \
            --task-definition "$NEW_ARN" \
            --force-new-deployment

      - name: Deploy frontend service
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$ECS_FRONTEND_TASK_FAMILY" \
            --query 'taskDefinition')
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$ECR_FRONTEND_REPOSITORY:${{ github.sha }}" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ')
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_FRONTEND_SERVICE" \
            --task-definition "$NEW_ARN" \
            --force-new-deployment

      # Fails the workflow (rather than reporting success once update-service is merely
      # accepted) if the new tasks don't pass their health checks — see docs/deployment.md
      # section 7. Sequential, not parallel: the backend's replace-then-drain rollout (see
      # docs/aws-deployment.md section 5) is deliberately slower than the frontend's, and
      # waiting on both at once would make a slow-but-fine backend rollout look identical to a
      # genuinely stuck one in the log output.
      - name: Wait for backend service to stabilize
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE"

      - name: Wait for frontend service to stabilize
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_FRONTEND_SERVICE"
